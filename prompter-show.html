<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>밴드 보컬 프롬프터</title>
<style>
  :root{
    --bg:#000; --fg:#fff; --dim:#555; --accent:#ffd11a; --panel:#111; --line:#222;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;overflow:hidden;}
  button{font-family:inherit;cursor:pointer;}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;}
  .screen.active{display:flex;}

  /* ---- Home ---- */
  #home{padding:20px;overflow-y:auto;}
  #home h1{font-size:1.6rem;margin:0 0 16px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .btn{background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:12px;padding:14px 18px;font-size:1rem;min-height:52px;}
  .btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
  .song-card{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .song-card .meta{flex:1;min-width:0;}
  .song-card .meta b{font-size:1.15rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .song-card .meta small{color:var(--dim);}
  .song-card button{min-height:48px;}
  .go{background:var(--accent);color:#000;font-weight:700;border:none;border-radius:10px;padding:12px 18px;font-size:1rem;}
  .empty{color:var(--dim);text-align:center;margin-top:40px;}

  /* ---- Editor ---- */
  #editor{padding:18px;overflow-y:auto;}
  #editor h2{font-size:1.3rem;margin:0 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;color:var(--dim);font-size:.85rem;margin-bottom:6px;}
  .field input,.field textarea,.field select{width:100%;background:var(--panel);color:var(--fg);
    border:1px solid var(--line);border-radius:10px;padding:12px;font-size:1rem;font-family:inherit;}
  .field textarea{min-height:140px;resize:vertical;line-height:1.5;}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .row>.field{flex:1;min-width:120px;margin-bottom:0;}
  .audiobar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0;
    position:sticky;top:0;z-index:2;box-shadow:0 6px 12px rgba(0,0,0,.6);}
  .audiobar .time{font-variant-numeric:tabular-nums;font-size:1.1rem;min-width:110px;}
  #seek{flex-basis:100%;width:100%;height:30px;accent-color:var(--accent);margin-top:2px;}
  .stamp{background:var(--accent);color:#000;font-weight:700;border:none;border-radius:10px;padding:14px 22px;font-size:1.1rem;flex:1;min-height:56px;}
  .lines{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px;}
  .lrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);}
  .lrow:last-child{border-bottom:none;}
  .lrow.cursor{background:#1a1a10;}
  .lrow .t{font-variant-numeric:tabular-nums;color:var(--accent);min-width:64px;font-size:.95rem;}
  .lrow .t.none{color:var(--dim);}
  .lrow .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lrow .tx.inter{color:var(--dim);}

  /* ---- Performance ---- */
  #perf{background:#000;}
  #perf .exit{position:absolute;top:14px;left:14px;z-index:5;background:rgba(255,255,255,.08);
    color:#888;border:none;border-radius:10px;padding:10px 14px;font-size:.9rem;}
  #perf .fontbtn{position:absolute;top:14px;right:14px;z-index:5;background:rgba(255,255,255,.08);
    color:#888;border:none;border-radius:10px;padding:10px 14px;font-size:.9rem;}
  #ready{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  #ready .title{font-size:2rem;font-weight:800;margin-bottom:24px;}
  #ready .hint{color:var(--accent);font-size:1.3rem;}
  #ready .hint small{display:block;color:var(--dim);font-size:.95rem;margin-top:10px;}
  #stage{flex:1;display:none;flex-direction:column;position:relative;}
  #stage.on{display:flex;}
  #countin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    font-size:28vh;font-weight:900;color:var(--accent);z-index:4;}
  #countin.on{display:flex;}
  .lyrics{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2.2vh;padding:2vh 5vw 0;text-align:center;--scale:1;overflow:hidden;}
  .ly{width:100%;overflow-wrap:break-word;word-break:keep-all;line-height:1.25;}
  .ly.prev,.ly.next{color:var(--dim);font-size:calc(var(--scale)*clamp(1.2rem,4.5vw,3rem));}
  .ly.cur{color:var(--accent);font-weight:800;font-size:calc(var(--scale)*clamp(2rem,8vw,6rem));}
  .controls{display:flex;align-items:stretch;gap:12px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));}
  .controls button{border:none;border-radius:16px;font-weight:700;color:#fff;background:#1c1c1c;}
  .nudge{flex:0 0 22%;font-size:2.4rem;background:#181818;}
  .nudge small{display:block;font-size:.75rem;font-weight:400;color:var(--dim);margin-top:2px;}
  .center{flex:1;display:flex;gap:12px;}
  .center button{flex:1;font-size:1.15rem;min-height:78px;}
  #resyncBtn{background:#2a2a10;color:var(--accent);}
  #pauseBtn{background:#242424;}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="home" class="screen active">
  <h1>🎤 밴드 보컬 프롬프터</h1>
  <div class="toolbar">
    <button class="btn primary" onclick="newSong()">+ 새 곡</button>
    <button class="btn" onclick="exportJSON()">세트리스트 내보내기</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">불러오기</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJSON(this)">
  </div>
  <div id="songList"></div>
</div>

<!-- ===== EDITOR ===== -->
<div id="editor" class="screen">
  <h2>곡 편집</h2>
  <div class="field"><label>곡 제목</label><input id="edTitle" oninput="onEdTitle(this.value)"></div>
  <div class="row" style="margin-bottom:14px">
    <div class="field"><label>BPM</label><input id="edBpm" type="number" min="20" max="300" inputmode="numeric" oninput="onEdBpm(this.value)"></div>
    <button class="btn" id="tapBtn" onclick="tapTempo()" style="min-width:120px">탭 템포</button>
    <div class="field"><label>탭 후 다운비트까지</label>
      <select id="edBeats" onchange="onEdBeats(this.value)">
        <option value="1">1박</option><option value="2" selected>2박</option><option value="4">4박</option>
      </select></div>
  </div>
  <div class="field"><label>가사 (한 줄 = 한 줄, 빈 줄 = 간주 ♪)</label>
    <textarea id="edLyrics" placeholder="가사를 붙여넣으세요"></textarea>
    <button class="btn" style="margin-top:8px" onclick="applyLyrics()">가사 적용 →</button>
  </div>

  <div class="audiobar">
    <input type="file" id="audioFile" accept="audio/*" onchange="loadAudio(this)" style="max-width:170px">
    <button class="btn" onclick="toggleAudio()">▶︎/⏸</button>
    <button class="btn" onclick="seekBy(-1)">−1s</button>
    <button class="btn" onclick="seekBy(1)">+1s</button>
    <span class="time" id="audioTime">0.0 / 0.0</span>
    <button class="stamp" onclick="stampLine()">찍기 (현재 줄) · Space</button>
    <input type="range" id="seek" min="0" max="0" step="0.05" value="0" oninput="seekAudio(this.value)">
  </div>

  <div class="lines" id="edLines"></div>
  <button class="btn" style="width:100%" onclick="goHome()">← 저장하고 목록으로</button>
  <audio id="player"></audio>
</div>

<!-- ===== PERFORMANCE ===== -->
<div id="perf" class="screen">
  <button class="exit" onclick="exitPerf()">✕ 목록</button>
  <button class="fontbtn" onclick="cycleFont()">글자 A±</button>

  <div id="ready" onclick="startCountIn()">
    <div class="title" id="pfTitle"></div>
    <div class="hint">화면을 탭하여 시작<small id="pfHint"></small></div>
  </div>

  <div id="stage">
    <div id="countin"></div>
    <div class="lyrics" id="lyrics">
      <div class="ly prev" id="lyPrev"></div>
      <div class="ly cur" id="lyCur"></div>
      <div class="ly next" id="lyNext"></div>
    </div>
    <div class="controls">
      <button class="nudge" onclick="nudge(-1)">‹<small>가사 늦게</small></button>
      <div class="center">
        <button id="resyncBtn" onclick="resync()">재동기화<br><small style="font-weight:400">지금 줄 맞춤</small></button>
        <button id="pauseBtn" onclick="togglePause()">일시정지</button>
      </div>
      <button class="nudge" onclick="nudge(1)">›<small>가사 빠르게</small></button>
    </div>
  </div>
</div>

let data = load();

function load(){
  if(EMBED) return JSON.parse(JSON.stringify(EMBED));
  try{ const d = JSON.parse(localStorage.getItem(LS_KEY)); if(d && d.songs) return d; }catch(e){}
  return { settings:{ fontSize:1 }, songs:[] };
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){} }

/* ---------- navigation ---------- */
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active'); }

/* ---------- HOME ---------- */
function renderHome(){
  const box = document.getElementById('songList');
  if(!data.songs.length){ box.innerHTML = '<div class="empty">아직 곡이 없습니다. “+ 새 곡”으로 시작하세요.</div>'; return; }
  box.innerHTML = data.songs.map((s,i)=>{
    const n = s.lines ? s.lines.filter(l=>!l.interlude).length : 0;
    return `<div class="song-card">
      <div class="meta"><b>${escapeHtml(s.title||'(제목 없음)')}</b>
        <small>${s.bpm||'?'} BPM · ${n}줄</small></div>
      <button class="go" onclick="openPerf(${i})">▶ 공연</button>
      <button class="btn" onclick="openEditor(${i})">편집</button>
      <button class="btn" onclick="delSong(${i})">🗑</button>
    </div>`;
  }).join('');
}
function goHome(){ save(); show('home'); renderHome(); }
function newSong(){ data.songs.push({ title:'', bpm:120, tapBeatsBeforeDownbeat:2, lines:[] });
  save(); openEditor(data.songs.length-1); }
function delSong(i){ if(confirm('이 곡을 삭제할까요?')){ data.songs.splice(i,1); save(); renderHome(); } }
function escapeHtml(s){ return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- EDITOR ---------- */
let edIndex = -1, edCursor = 0, tapTimes = [];
function openEditor(i){
  edIndex = i; edCursor = 0; tapTimes = [];
  const s = data.songs[i];
  document.getElementById('edTitle').value = s.title||'';
  document.getElementById('edBpm').value = s.bpm||'';
  document.getElementById('edBeats').value = s.tapBeatsBeforeDownbeat||2;
  document.getElementById('edLyrics').value = (s.lines||[]).map(l=> l.interlude?'':l.text).join('\n');
  renderLines();
  show('editor');
}
function song(){ return data.songs[edIndex]; }
function onEdTitle(v){ song().title=v; save(); }
function onEdBpm(v){ song().bpm=parseInt(v)||0; save(); }
function onEdBeats(v){ song().tapBeatsBeforeDownbeat=parseInt(v)||2; save(); }

function applyLyrics(){
  const raw = document.getElementById('edLyrics').value.split('\n');
  const old = song().lines||[];
  song().lines = raw.map((line,i)=>{
    const t = line.trim(), isInter = (t==='');
    const o = { }; if(isInter) o.interlude=true; else o.text=t;
    if(old[i] && !!old[i].interlude===isInter && (isInter||old[i].text===t) && old[i].time!=null) o.time=old[i].time;
    return o;
  });
  // drop trailing empty interlude lines from accidental blank tail
  while(song().lines.length && song().lines[song().lines.length-1].interlude && song().lines[song().lines.length-1].time==null)
    song().lines.pop();
  edCursor = 0; save(); renderLines();
}
function renderLines(){
  const box = document.getElementById('edLines');
  const lines = song().lines||[];
  if(!lines.length){ box.innerHTML='<div class="lrow"><span class="tx inter">가사를 입력하고 “가사 적용”을 누르세요</span></div>'; return; }
  box.innerHTML = lines.map((l,i)=>`
    <div class="lrow ${i===edCursor?'cursor':''}" onclick="setCursor(${i})">
      <span class="t ${l.time==null?'none':''}">${l.time==null?'—':l.time.toFixed(1)+'s'}</span>
      <span class="tx ${l.interlude?'inter':''}">${l.interlude?'♪ 간주':escapeHtml(l.text)}</span>
    </div>`).join('');
  const cur = box.querySelector('.lrow.cursor');
  if(cur) cur.scrollIntoView({block:'center'});
}
function setCursor(i){ edCursor=i; renderLines(); }

const player = document.getElementById('player');
function loadAudio(input){ const f=input.files[0]; if(!f) return; player.src=URL.createObjectURL(f); }
function toggleAudio(){ if(player.paused) player.play(); else player.pause(); }
function seekAudio(v){ player.currentTime=+v; }
function seekBy(d){ player.currentTime=Math.max(0,Math.min(player.duration||0, player.currentTime+d)); }
function updateAudioUI(){
  const dur=player.duration||0;
  document.getElementById('audioTime').textContent=player.currentTime.toFixed(1)+' / '+dur.toFixed(1);
  const s=document.getElementById('seek');
  if(document.activeElement!==s){ s.max=dur; s.value=player.currentTime; }
}
player.addEventListener('loadedmetadata',()=>{ document.getElementById('seek').max=player.duration||0; updateAudioUI(); });
player.addEventListener('timeupdate',updateAudioUI);
function stampLine(){
  const lines=song().lines||[]; if(!lines.length||!player.src) return;
  if(edCursor>=lines.length) return;
  lines[edCursor].time = +player.currentTime.toFixed(2);
  edCursor = Math.min(edCursor+1, lines.length);
  save(); renderLines();
}
function tapTempo(){
  const now=performance.now();
  if(tapTimes.length && now-tapTimes[tapTimes.length-1]>2000) tapTimes=[];
  tapTimes.push(now); if(tapTimes.length>8) tapTimes.shift();
  if(tapTimes.length>=2){
    let sum=0; for(let i=1;i<tapTimes.length;i++) sum+=tapTimes[i]-tapTimes[i-1];
    const bpm=Math.round(60000/(sum/(tapTimes.length-1)));
    document.getElementById('edBpm').value=bpm; song().bpm=bpm; save();
    document.getElementById('tapBtn').textContent='탭 '+bpm;
  } else document.getElementById('tapBtn').textContent='탭…';
}
// Space = stamp while editing
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && document.getElementById('editor').classList.contains('active')
     && e.target.tagName!=='TEXTAREA' && e.target.tagName!=='INPUT'){ e.preventDefault(); stampLine(); }
});

/* ---------- import / export ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='setlist.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.songs)) throw 0;
      if(!d.settings) d.settings={fontSize:1};
      data=d; save(); renderHome();
    }catch(e){ alert('세트리스트 JSON을 읽을 수 없습니다.'); } input.value=''; };
  r.readAsText(f);
}

/* ---------- PERFORMANCE ---------- */
let pf = null, wakeLock=null;
function openPerf(i){
  const s=data.songs[i];
  pf = { s, beatMs:60000/(s.bpm||120), songStart:null, phase:'ready', paused:false, pausedElapsed:0, raf:null };
  document.getElementById('pfTitle').textContent = s.title||'(제목 없음)';
  document.getElementById('pfHint').textContent =
    `드럼 카운트 기준 다운비트 ${s.tapBeatsBeforeDownbeat||2}박 전에 탭 · ${s.bpm||'?'} BPM`;
  document.getElementById('ready').style.display='flex';
  document.getElementById('stage').classList.remove('on');
  document.getElementById('countin').classList.remove('on');
  applyFont();
  show('perf'); requestWake();
}
function startCountIn(){
  if(!pf||pf.phase!=='ready') return;
  const beats = pf.s.tapBeatsBeforeDownbeat||2;
  const now = performance.now();
  pf.downbeat = now + beats*pf.beatMs;
  pf.songStart = pf.downbeat;   // timer 0 == downbeat
  pf.phase='countin';
  document.getElementById('ready').style.display='none';
  document.getElementById('stage').classList.add('on');
  document.getElementById('countin').classList.add('on');
  loop();
}
function currentTime(){
  if(pf.paused) return pf.pausedElapsed;
  return (performance.now()-pf.songStart)/1000;
}
function findIndex(t){
  const L=pf.s.lines; let idx=-1;
  for(let i=0;i<L.length;i++){ if(L[i].time!=null && L[i].time<=t) idx=i; else if(L[i].time!=null) break; }
  return idx;
}
function lineText(l){ return l ? (l.interlude?'♪':escapeHtml(l.text)) : ''; }
function loop(){
  const now=performance.now();
  if(pf.phase==='countin'){
    if(now < pf.downbeat){
      document.getElementById('countin').textContent = Math.ceil((pf.downbeat-now)/pf.beatMs);
    }else{
      pf.phase='running';
      const ci=document.getElementById('countin'); ci.textContent='GO';
      setTimeout(()=>ci.classList.remove('on'), 350);
    }
  }
  if(pf.phase==='running'){
    const t=currentTime(); const L=pf.s.lines; const idx=findIndex(t);
    document.getElementById('lyPrev').innerHTML = lineText(L[idx-1]);
    document.getElementById('lyCur').innerHTML  = lineText(L[idx]);
    document.getElementById('lyNext').innerHTML = lineText(L[idx+1]);
  }
  pf.raf=requestAnimationFrame(loop);
}
function nudge(dir){ if(!pf||pf.phase!=='running') return;
  // '>' (dir=1) 가사 빠르게 = 진도 앞으로 = songStart 앞당김
  pf.songStart -= dir*1000;
  if(pf.paused) pf.pausedElapsed += dir*1;
}
function resync(){ if(!pf||pf.phase!=='running') return;
  const idx=findIndex(currentTime()); if(idx<0) return;
  const lt=pf.s.lines[idx].time;
  if(pf.paused){ pf.pausedElapsed=lt; }
  else pf.songStart = performance.now() - lt*1000;
}
function togglePause(){ if(!pf||pf.phase!=='running') return;
  const b=document.getElementById('pauseBtn');
  if(pf.paused){ pf.songStart=performance.now()-pf.pausedElapsed*1000; pf.paused=false; b.textContent='일시정지'; }
  else{ pf.pausedElapsed=currentTime(); pf.paused=true; b.textContent='재개'; }
}
function exitPerf(){ if(pf&&pf.raf) cancelAnimationFrame(pf.raf); pf=null; releaseWake(); show('home'); renderHome(); }

/* ---- font size 3-step ---- */
function applyFont(){ const s=(data.settings.fontSize??1); document.getElementById('lyrics').style.setProperty('--scale',[0.8,1,1.3][s]); }
function cycleFont(){ data.settings.fontSize=((data.settings.fontSize??1)+1)%3; save(); applyFont(); }

/* ---- wake lock ---- */
async function requestWake(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'
  && document.getElementById('perf').classList.contains('active')) requestWake(); });

/* ---- boot ---- */
renderHome(); applyFont();

/* ---- self-test (console) ---- */
function selfTest(){
  const saved=pf;
  pf={ s:{ lines:[{text:'a',time:1},{text:'b',time:3},{interlude:true,time:5},{text:'c',time:7}] } };
  console.assert(findIndex(0)===-1,'before first');
  console.assert(findIndex(1)===0,'exact first');
  console.assert(findIndex(4)===1,'mid');
  console.assert(findIndex(6)===2,'interlude active');
  console.assert(findIndex(100)===3,'last');
  // count-in: 120bpm(beatMs 500), 2 beats -> downbeat 1000ms after tap
  const beatMs=60000/120, beats=2; console.assert(beats*beatMs===1000,'downbeat math');
  pf=saved; console.log('selfTest done');
}
if(location.hash==='#test') selfTest();
